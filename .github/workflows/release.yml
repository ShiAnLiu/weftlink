name: Release

# CD: on tag push, verify, cross-compile weftlinkd for all desktop/server
# targets, checksum, and attach to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1

      - name: Verify gen/ matches schema
        run: go run ./tools/gen -check

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          mkdir -p dist
          daemon="dist/weftlinkd-${GOOS}-${GOARCH}${{ matrix.ext }}"
          cli="dist/weftlink-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X main.productVersion=${version}" \
            -o "$daemon" ./src
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o "$cli" ./cli
          echo "built $daemon"
          echo "built $cli"

      - name: Package archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="${REF_NAME#v}"
          mkdir -p pkg
          # Correct names next to each other: `weftlink up` spawns ./weftlinkd
          cp "dist/weftlinkd-${GOOS}-${GOARCH}${EXT}" "pkg/weftlinkd${EXT}"
          cp "dist/weftlink-${GOOS}-${GOARCH}${EXT}"  "pkg/weftlink${EXT}"
          if [ "$GOOS" = "windows" ]; then
            cp docs/dist/HOWTO-Windows.txt pkg/HOWTO.txt
            (cd pkg && zip -q -r "../dist/weftlink-${version}-${GOOS}-${GOARCH}.zip" .)
          else
            cp docs/dist/README-other.txt pkg/README.txt
            (cd pkg && tar czf "../dist/weftlink-${version}-${GOOS}-${GOARCH}.tar.gz" .)
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weftlinkd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum $(ls -1 | grep -v '^SHA256SUMS$') > SHA256SUMS
          cat SHA256SUMS

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
