name: Release

# CD: on tag push, verify, cross-compile weftlinkd for all desktop/server
# targets, checksum, and attach to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1

      - name: Verify gen/ matches schema
        run: go run ./tools/gen -check

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          mkdir -p dist
          daemon="dist/weftlinkd-${GOOS}-${GOARCH}${{ matrix.ext }}"
          cli="dist/weftlink-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X main.productVersion=${version}" \
            -o "$daemon" ./src
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o "$cli" ./cli
          echo "built $daemon"
          echo "built $cli"

      - name: Package archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="${REF_NAME#v}"
          mkdir -p pkg
          # Correct names next to each other: `weftlink up` spawns ./weftlinkd
          cp "dist/weftlinkd-${GOOS}-${GOARCH}${EXT}" "pkg/weftlinkd${EXT}"
          cp "dist/weftlink-${GOOS}-${GOARCH}${EXT}"  "pkg/weftlink${EXT}"
          if [ "$GOOS" = "windows" ]; then
            cp docs/dist/HOWTO-Windows.txt pkg/HOWTO.txt
            (cd pkg && zip -q -r "../dist/weftlink-${version}-${GOOS}-${GOARCH}.zip" .)
          else
            cp docs/dist/README-other.txt pkg/README.txt
            (cd pkg && tar czf "../dist/weftlink-${version}-${GOOS}-${GOARCH}.tar.gz" .)
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weftlinkd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  msix:
    name: MSIX (Windows x64)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure C++ clients
        run: |
          cmake -S clients/cpp -B build/qt -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build C++ clients
        run: cmake --build build/qt

      - name: Stage Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/msix-package | Out-Null
          go build -trimpath -ldflags "-s -w" -o build/msix-package/weftlink.exe ./cli
          go build -trimpath -ldflags "-s -w" -o build/msix-package/weftlinkd.exe ./src
          Copy-Item build/qt/weftlink-gui.exe,build/qt/weftlink-tui.exe build/msix-package -Force
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations `
            --compiler-runtime --dir build/msix-package `
            build/msix-package/weftlink-gui.exe build/msix-package/weftlink-tui.exe

      - name: Prepare signing certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.MSIX_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          if ($env:PFX_B64) {
            [IO.File]::WriteAllBytes("build/weftlink-signing.pfx", [Convert]::FromBase64String($env:PFX_B64))
            $password = $env:PFX_PASSWORD
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
              "build/weftlink-signing.pfx", $password)
            $publisher = $cert.Subject
            $cer = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
            [IO.File]::WriteAllBytes("build/weftlink-signing.cer", $cer)
            "MSIX_DEV_CERT=0" >> $env:GITHUB_ENV
          } else {
            $password = "weftlink"
            $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Weftlink" `
              -KeyUsage DigitalSignature -FriendlyName "Weftlink MSIX Dev" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
              -NotAfter (Get-Date).AddYears(3)
            $pwd = ConvertTo-SecureString $password -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath build/weftlink-signing.pfx -Password $pwd | Out-Null
            Export-Certificate -Cert $cert -FilePath build/weftlink-signing.cer | Out-Null
            $publisher = "CN=Weftlink"
            "MSIX_DEV_CERT=1" >> $env:GITHUB_ENV
          }
          "MSIX_PUBLISHER=$publisher" >> $env:GITHUB_ENV
          "MSIX_PFX_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Build signed MSIX
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./packaging/msix/build-msix.ps1 `
            -PackageDir build/msix-package `
            -Version $version `
            -OutFile "build/weftlink-$version-x64.msix" `
            -Publisher $env:MSIX_PUBLISHER `
            -CertificatePfx build/weftlink-signing.pfx `
            -CertificatePassword $env:MSIX_PFX_PASSWORD

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: weftlink-msix
          path: |
            build/weftlink-*-x64.msix
            build/weftlink-signing.cer
          if-no-files-found: error

  release:
    name: Create release
    needs: [build, msix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum $(ls -1 | grep -v '^SHA256SUMS$') > SHA256SUMS
          cat SHA256SUMS

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
