name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p bin
          go build -o bin/weftlinkd ./src

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Check gofmt (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  dart:
    name: Dart client (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build daemon
        run: |
          mkdir -p bin
          go build -o bin/weftlinkd ./src

      - name: Start daemon (background)
        run: |
          ./bin/weftlinkd > /tmp/weftlinkd.log 2>&1 &
          sleep 2
          cat /tmp/weftlinkd.log

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Dart pub get
        working-directory: clients/flutter/packages/core_client
        run: dart pub get

      - name: Dart analyze
        working-directory: clients/flutter/packages/core_client
        run: dart analyze

      - name: Dart test
        working-directory: clients/flutter/packages/core_client
        run: dart test

  schema:
    name: Schema consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate schema files parse
        run: |
          echo "Validating protocol schema..."
          test -f protocol/schema/weftlink.yaml && echo "schema file exists: OK"
          test -f protocol/conformance/hello.json && echo "conformance file exists: OK"

      - name: Verify gen/ matches schema
        run: |
          go run ./tools/gen -check
          echo "gen/ is in sync with protocol/schema/weftlink.yaml"