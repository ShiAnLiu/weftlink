name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `go build ./...` collides with the src/ and gen/ directory names on
      # Linux/macOS, so always build to an explicit output path.
      - name: Build binaries
        run: |
          go build -trimpath -o "${{ runner.temp }}/weftlinkd" ./src
          go build -trimpath -o "${{ runner.temp }}/weftlink" ./cli

      - name: Verify gen/ matches schema
        run: go run ./tools/gen -check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./... -count=1

      - name: Check gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  cli:
    name: CLI (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEFTLINK_HOME: ${{ runner.temp }}/weftlink-home
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p bin
          go build -trimpath -o bin/weftlinkd ./src
          go build -trimpath -o bin/weftlink ./cli

      - name: Smoke test
        run: |
          ./bin/weftlink help > /dev/null
          ./bin/weftlink version
          ./bin/weftlink up
          ./bin/weftlink status
          ./bin/weftlink ping --count 2
          ./bin/weftlink ls
          ./bin/weftlink knot
          ./bin/weftlink status --json | python3 -m json.tool > /dev/null
          ./bin/weftlink ping --count 2 --json | python3 -m json.tool > /dev/null
          ./bin/weftlink ls --json | python3 -m json.tool > /dev/null

  dart:
    name: Dart core_client (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEFTLINK_REQUIRE_DAEMON: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Build + start daemon
        run: |
          mkdir -p bin
          go build -trimpath -o bin/weftlinkd ./src
          ./bin/weftlinkd > /tmp/weftlinkd.log 2>&1 &
          echo $! > /tmp/weftlinkd.pid
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat /tmp/weftlinkd.pid)" 2>/dev/null; then
              echo "daemon exited during startup:"
              cat /tmp/weftlinkd.log
              exit 1
            fi
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/7801' 2>/dev/null; then
              echo "daemon ready"
              cat /tmp/weftlinkd.log
              exit 0
            fi
            sleep 1
          done
          echo "daemon not reachable on 127.0.0.1:7801:"
          cat /tmp/weftlinkd.log
          exit 1

      - name: pub get / analyze / test
        working-directory: clients/flutter/packages/core_client
        run: |
          dart pub get
          dart analyze
          dart test

  flutter:
    name: Flutter app (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEFTLINK_REQUIRE_DAEMON: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build + start daemon
        run: |
          mkdir -p bin
          go build -trimpath -o bin/weftlinkd ./src
          ./bin/weftlinkd > /tmp/weftlinkd.log 2>&1 &
          echo $! > /tmp/weftlinkd.pid
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat /tmp/weftlinkd.pid)" 2>/dev/null; then
              echo "daemon exited during startup:"
              cat /tmp/weftlinkd.log
              exit 1
            fi
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/7801' 2>/dev/null; then
              echo "daemon ready"
              cat /tmp/weftlinkd.log
              exit 0
            fi
            sleep 1
          done
          echo "daemon not reachable on 127.0.0.1:7801:"
          cat /tmp/weftlinkd.log
          exit 1

      - name: core_client — pub get / analyze / test
        working-directory: clients/flutter/packages/core_client
        run: |
          flutter pub get
          dart analyze
          dart test

      - name: app — pub get / analyze / test
        working-directory: clients/flutter/app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  schema:
    name: Schema + generated types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Schema and conformance files present
        run: |
          test -f protocol/schema/weftlink.yaml
          test -f protocol/conformance/hello.json
          echo "schema + conformance files: OK"

      - name: Validate conformance vectors are JSON
        run: |
          shopt -s nullglob
          files=(protocol/conformance/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no conformance vectors found"
            exit 1
          fi
          for f in "${files[@]}"; do
            python3 -m json.tool "$f" > /dev/null
            echo "ok: $f"
          done

      - name: Verify gen/ matches schema
        run: go run ./tools/gen -check

      - name: Verify generated Go is gofmt-clean
        run: |
          unformatted=$(gofmt -l gen/go)
          if [ -n "$unformatted" ]; then
            echo "Generated files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
