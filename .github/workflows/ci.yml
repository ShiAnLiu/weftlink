name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `go build ./...` collides with the src/ and gen/ directory names on
      # Linux/macOS, so always build to an explicit output path.
      - name: Build binaries
        run: |
          go build -trimpath -o "${{ runner.temp }}/weftlinkd" ./src
          go build -trimpath -o "${{ runner.temp }}/weftlink" ./cli

      - name: Verify gen/ matches schema
        run: go run ./tools/gen -check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./... -count=1

      - name: Check gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  qt-linux:
    name: C++/Qt (Linux build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libgl1-mesa-dev \
            libxkbcommon-dev libfontconfig1-dev

      - name: Configure
        run: |
          cmake -S clients/cpp -B build/qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/qt

      - name: Test
        run: |
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/qt --output-on-failure

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: TUI TLS smoke test against live daemon
        env:
          WEFTLINK_HOME: ${{ runner.temp }}/weftlink-home
        run: |
          mkdir -p bin
          go build -trimpath -o bin/weftlinkd ./src
          ./bin/weftlinkd > /tmp/weftlinkd.log 2>&1 &
          for i in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/7801' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          ./build/qt/weftlink-tui --check

  qt-windows:
    name: C++/Qt (Windows build + tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        run: |
          cmake -S clients/cpp -B build/qt -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/qt

      - name: Test
        run: ctest --test-dir build/qt --output-on-failure

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Stage Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/msix-package | Out-Null
          go build -trimpath -ldflags "-s -w" -o build/msix-package/weftlink.exe ./cli
          go build -trimpath -ldflags "-s -w" -o build/msix-package/weftlinkd.exe ./src
          Copy-Item build/qt/weftlink-gui.exe,build/qt/weftlink-tui.exe build/msix-package -Force
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations `
            --compiler-runtime --dir build/msix-package `
            build/msix-package/weftlink-gui.exe build/msix-package/weftlink-tui.exe

      - name: Create MSIX signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Weftlink" `
            -KeyUsage DigitalSignature -FriendlyName "Weftlink MSIX Dev" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
            -NotAfter (Get-Date).AddYears(3)
          $pwd = ConvertTo-SecureString "weftlink" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath build/weftlink-dev.pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath build/weftlink-dev.cer | Out-Null

      - name: Build MSIX
        shell: pwsh
        run: |
          $match = Select-String -Path src/core.go -Pattern 'var productVersion = "([^"]+)"' | Select-Object -First 1
          $version = if ($match) { $match.Matches[0].Groups[1].Value } else { "0.5.0" }
          ./packaging/msix/build-msix.ps1 `
            -PackageDir build/msix-package `
            -Version $version `
            -OutFile "build/weftlink-$version-x64.msix" `
            -CertificatePfx build/weftlink-dev.pfx `
            -CertificatePassword "weftlink"

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: weftlink-msix
          path: |
            build/weftlink-*-x64.msix
            build/weftlink-dev.cer
          if-no-files-found: error

  transfer:
    name: M2 e2e (two daemons)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p bin
          go build -trimpath -o bin/weftlinkd ./src
          go build -trimpath -o bin/weftlink ./cli

      - name: Pair, send, receive
        run: |
          rm -rf /tmp/weftlink-a /tmp/weftlink-b /tmp/weftlink-recv
          WEFTLINK_HOME=/tmp/weftlink-a WEFTLINK_NAME=ci-a WEFTLINK_PORT=7821 \
            ./bin/weftlinkd > /tmp/weftlink-a.log 2>&1 &
          WEFTLINK_HOME=/tmp/weftlink-b WEFTLINK_NAME=ci-b WEFTLINK_PORT=7831 \
            ./bin/weftlinkd > /tmp/weftlink-b.log 2>&1 &
          for port in 7821 7831; do
            for i in $(seq 1 30); do
              if timeout 1 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then
                break
              fi
              sleep 1
            done
          done

          code=$(./bin/weftlink knot --port 7821 --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          ./bin/weftlink knot "$code" --peer 127.0.0.1:7821 --port 7831

          ./bin/weftlink recv --port 7831 --dir /tmp/weftlink-recv --from ci-a --timeout 60 \
            > /tmp/weftlink-recv.log 2>&1 &
          recv_pid=$!
          sleep 1
          head -c 262144 /dev/urandom > /tmp/payload.bin
          ./bin/weftlink send ci-b /tmp/payload.bin --port 7821
          wait "$recv_pid"
          cat /tmp/weftlink-recv.log
          cmp /tmp/payload.bin /tmp/weftlink-recv/payload.bin
          ./bin/weftlink status ci-b --port 7821 | grep -q "remote peer"

          ./bin/weftlink run ci-b "echo run-ok" --port 7821 > /tmp/weftlink-run.log 2>&1 &
          run_pid=$!
          exec_id=""
          for i in $(seq 1 20); do
            exec_id=$(./bin/weftlink requests --port 7831 --json \
              | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r[0]["exec_id"] if r else "")')
            if [ -n "$exec_id" ]; then
              break
            fi
            sleep 0.5
          done
          test -n "$exec_id"
          ./bin/weftlink approve "$exec_id" --port 7831
          wait "$run_pid"
          grep -q "run-ok" /tmp/weftlink-run.log
          ./bin/weftlink requests --port 7831 | grep -q "no pending exec requests"

  cli:
    name: CLI (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p bin
          go build -trimpath -o bin/weftlinkd ./src
          go build -trimpath -o bin/weftlink ./cli

      - name: Smoke test
        env:
          WEFTLINK_HOME: ${{ runner.temp }}/weftlink-home
        run: |
          ./bin/weftlink help > /dev/null
          ./bin/weftlink version
          ./bin/weftlink up
          ./bin/weftlink status
          ./bin/weftlink ping --count 2
          ./bin/weftlink ls
          ./bin/weftlink knot
          ./bin/weftlink status --json | python3 -m json.tool > /dev/null
          ./bin/weftlink ping --count 2 --json | python3 -m json.tool > /dev/null
          ./bin/weftlink ls --json | python3 -m json.tool > /dev/null

  dart:
    name: Dart core_client (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEFTLINK_REQUIRE_DAEMON: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Build + start daemon
        run: |
          mkdir -p bin
          go build -trimpath -o bin/weftlinkd ./src
          ./bin/weftlinkd > /tmp/weftlinkd.log 2>&1 &
          echo $! > /tmp/weftlinkd.pid
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat /tmp/weftlinkd.pid)" 2>/dev/null; then
              echo "daemon exited during startup:"
              cat /tmp/weftlinkd.log
              exit 1
            fi
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/7801' 2>/dev/null; then
              echo "daemon ready"
              cat /tmp/weftlinkd.log
              exit 0
            fi
            sleep 1
          done
          echo "daemon not reachable on 127.0.0.1:7801:"
          cat /tmp/weftlinkd.log
          exit 1

      - name: pub get / analyze / test
        working-directory: clients/flutter/packages/core_client
        run: |
          dart pub get
          dart analyze
          dart test

  flutter:
    name: Flutter app (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEFTLINK_REQUIRE_DAEMON: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build + start daemon
        run: |
          mkdir -p bin
          go build -trimpath -o bin/weftlinkd ./src
          ./bin/weftlinkd > /tmp/weftlinkd.log 2>&1 &
          echo $! > /tmp/weftlinkd.pid
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat /tmp/weftlinkd.pid)" 2>/dev/null; then
              echo "daemon exited during startup:"
              cat /tmp/weftlinkd.log
              exit 1
            fi
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/7801' 2>/dev/null; then
              echo "daemon ready"
              cat /tmp/weftlinkd.log
              exit 0
            fi
            sleep 1
          done
          echo "daemon not reachable on 127.0.0.1:7801:"
          cat /tmp/weftlinkd.log
          exit 1

      - name: core_client 鈥?pub get / analyze / test
        working-directory: clients/flutter/packages/core_client
        run: |
          flutter pub get
          dart analyze
          dart test

      - name: app 鈥?pub get / analyze / test
        working-directory: clients/flutter/app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  schema:
    name: Schema + generated types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Schema and conformance files present
        run: |
          test -f protocol/schema/weftlink.yaml
          test -f protocol/conformance/hello.json
          echo "schema + conformance files: OK"

      - name: Validate conformance vectors are JSON
        run: |
          shopt -s nullglob
          files=(protocol/conformance/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no conformance vectors found"
            exit 1
          fi
          for f in "${files[@]}"; do
            python3 -m json.tool "$f" > /dev/null
            echo "ok: $f"
          done

      - name: Verify gen/ matches schema
        run: go run ./tools/gen -check

      - name: Verify generated Go is gofmt-clean
        run: |
          unformatted=$(gofmt -l gen/go)
          if [ -n "$unformatted" ]; then
            echo "Generated files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
